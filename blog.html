<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perspectives — Emblem Strategic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="posts.js"></script>
  <style>
    :root{--crimson:#7a1a1a;--crimson-light:#9b2626;--cream:#f5f0e8;--cream-dark:#ede8de;--charcoal:#2c2c2c;--gray:#6b6b6b}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--cream);color:var(--charcoal);font-family:'Cormorant Garamond',serif;min-height:100vh}
    nav{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--cream);border-bottom:1px solid var(--cream-dark);padding:0 2rem;height:64px;display:flex;align-items:center;justify-content:space-between}
    .nav-logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;font-family:'Montserrat',sans-serif;font-size:.75rem;font-weight:600;letter-spacing:.18em;color:var(--crimson)}
    .nav-logo svg{width:32px;height:32px}
    .nav-links{display:flex;gap:2rem;list-style:none}
    .nav-links a{font-family:'Montserrat',sans-serif;font-size:.7rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--charcoal);transition:color .2s}
    .nav-links a:hover,.nav-links a.active{color:var(--crimson)}
    .page-wrap{padding-top:64px;min-height:100vh}
    .blog-index{max-width:860px;margin:0 auto;padding:4rem 2rem 6rem}
    .blog-index-header{margin-bottom:3rem;border-bottom:1px solid var(--cream-dark);padding-bottom:2rem}
    .blog-index-label{font-family:'Montserrat',sans-serif;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--crimson-light);margin-bottom:.75rem}
    .blog-index-title{font-size:clamp(2rem,4vw,3rem);font-weight:300;color:var(--charcoal);margin-bottom:1rem}
    .blog-index-desc{font-size:1.1rem;color:var(--gray);font-style:italic;line-height:1.6}
    .tag-filter{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:2.5rem;align-items:center}
    .tag-filter-label{font-family:'Montserrat',sans-serif;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);margin-right:.25rem}
    .tag-btn{font-family:'Montserrat',sans-serif;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;padding:.35rem .85rem;border:1px solid var(--cream-dark);background:transparent;color:var(--gray);cursor:pointer;transition:all .2s;border-radius:2px}
    .tag-btn:hover{border-color:var(--crimson);color:var(--crimson)}
    .tag-btn.active{background:var(--crimson);border-color:var(--crimson);color:white}
    .post-card{border-top:1px solid var(--cream-dark);padding:2.5rem 0;cursor:pointer;transition:opacity .2s}
    .post-card:hover{opacity:.85}
    .post-card-meta{display:flex;align-items:center;gap:1.25rem;margin-bottom:.75rem;flex-wrap:wrap}
    .post-card-date{font-family:'Montserrat',sans-serif;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--crimson-light)}
    .post-card-read{font-family:'Montserrat',sans-serif;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gray)}
    .post-card-tags{display:flex;gap:.4rem;flex-wrap:wrap}
    .post-tag{font-family:'Montserrat',sans-serif;font-size:.6rem;letter-spacing:.07em;text-transform:uppercase;padding:.2rem .55rem;border:1px solid var(--cream-dark);color:var(--gray);border-radius:2px}
    .post-card-title{font-size:clamp(1.3rem,2.5vw,1.75rem);font-weight:500;line-height:1.3;color:var(--charcoal);margin-bottom:.85rem}
    .post-card-excerpt{font-size:1.05rem;line-height:1.7;color:var(--gray);font-style:italic;margin-bottom:1rem}
    .post-card-readmore{font-family:'Montserrat',sans-serif;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--crimson);text-decoration:none}
    .post-card-readmore::after{content:' →'}
    .no-results{padding:3rem 0;color:var(--gray);font-style:italic;font-size:1.1rem}
    .post-view{max-width:760px;margin:0 auto;padding:4rem 2rem 6rem}
    .post-back{font-family:'Montserrat',sans-serif;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--crimson);text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;margin-bottom:3rem}
    .post-back::before{content:'←'}
    .post-header{margin-bottom:3rem;border-bottom:1px solid var(--cream-dark);padding-bottom:2.5rem}
    .post-meta{display:flex;align-items:center;gap:1.25rem;margin-bottom:1.25rem;flex-wrap:wrap}
    .post-date{font-family:'Montserrat',sans-serif;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--crimson-light)}
    .post-read{font-family:'Montserrat',sans-serif;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gray)}
    .post-tags{display:flex;gap:.4rem;flex-wrap:wrap}
    .post-title{font-size:clamp(1.75rem,4vw,2.5rem);font-weight:400;line-height:1.25;color:var(--charcoal)}
    .post-body p{font-size:clamp(1rem,1.5vw,1.15rem);line-height:1.85;color:var(--charcoal);margin-bottom:1.5rem}
    .post-byline{margin-top:3rem;padding-top:2rem;border-top:1px solid var(--cream-dark);font-style:italic;color:var(--crimson);font-size:1rem;line-height:1.6}
    footer{background:var(--charcoal);color:rgba(255,255,255,.5);text-align:center;padding:2rem;font-family:'Montserrat',sans-serif;font-size:.7rem;letter-spacing:.08em}
    footer a{color:rgba(255,255,255,.7);text-decoration:none}
    footer a:hover{color:white}
    @media(max-width:640px){nav{padding:0 1rem}.nav-links{display:none}.blog-index,.post-view{padding:2.5rem 1.25rem 4rem}}
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="18" stroke="#7a1a1a" stroke-width="1.5"/><path d="M20 8 L20 32 M12 14 L28 14 M12 20 L28 20 M12 26 L28 26" stroke="#7a1a1a" stroke-width="1.2"/></svg>
      <span>EMBLEM<br>STRATEGIC</span>
    </a>
    <ul class="nav-links">
      <li><a href="/#who">Who We Work With</a></li>
      <li><a href="/#what">What We Do</a></li>
      <li><a href="/#how">How We Work</a></li>
      <li><a href="/#andy">Andy Tarsy</a></li>
      <li><a href="/#engagements">Engagements</a></li>
      <li><a href="/blog.html" class="active">Blog</a></li>
      <li><a href="/#network">Emblem Network</a></li>
      <li><a href="/#contact">Contact</a></li>
    </ul>
  </nav>
  <div class="page-wrap" id="page-wrap"></div>
  <footer><a href="/">emblemstrategic.com</a> &nbsp;&middot;&nbsp; &copy; 2026 Emblem Strategic LLC</footer>
  <script>
    function getSlug(){var p=new URLSearchParams(window.location.search);return p.get('post');}
    function navigateToPost(slug){var url=new URL(window.location);url.searchParams.set('post',slug);window.history.pushState({slug},'',url);renderPage();}
    function navigateToIndex(tag){var url=new URL(window.location);url.searchParams.delete('post');if(tag)url.searchParams.set('tag',tag);else url.searchParams.delete('tag');window.history.pushState({tag},'',url);renderPage();}
    window.addEventListener('popstate',renderPage);
    function renderPage(){var slug=getSlug();var wrap=document.getElementById('page-wrap');if(slug){var post=EMBLEM_POSTS.find(function(p){return p.slug===slug;});if(post){renderPost(post,wrap);return;}}renderIndex(wrap);}
    function renderIndex(wrap){
      var params=new URLSearchParams(window.location.search);
      var activeTag=params.get('tag')||'';
      document.title='Perspectives — Emblem Strategic';
      var allTags=[...new Set(EMBLEM_POSTS.flatMap(function(p){return p.tags;}))].sort();
      var posts=activeTag?EMBLEM_POSTS.filter(function(p){return p.tags.includes(activeTag);}):EMBLEM_POSTS;
      var sorted=[...posts].sort(function(a,b){return b.date.localeCompare(a.date);});
      wrap.innerHTML='<div class="blog-index"><div class="blog-index-header"><div class="blog-index-label">From the Field</div><h1 class="blog-index-title">Perspectives</h1><p class="blog-index-desc">Thinking on stakeholder strategy, civic leadership, and the work of building trust across difference.</p></div><div class="tag-filter"><span class="tag-filter-label">Filter:</span><button class="tag-btn '+((!activeTag)?'active':'')+'" onclick="navigateToIndex('')">All</button>'+allTags.map(function(tag){return '<button class="tag-btn '+(activeTag===tag?'active':'')+'" onclick="navigateToIndex(''+tag.replace(/'/g,"\'")+'')">'+ tag+'</button>';}).join('')+'</div>'+(sorted.length===0?'<div class="no-results">No posts found.</div>':'')+sorted.map(function(post){return '<div class="post-card" onclick="navigateToPost(''+post.slug+'')"><div class="post-card-meta"><span class="post-card-date">'+post.dateDisplay+'</span><span class="post-card-read">'+post.readTime+'</span><div class="post-card-tags">'+post.tags.map(function(t){return '<span class="post-tag">'+t+'</span>';}).join('')+'</div></div><h2 class="post-card-title">'+post.title+'</h2><p class="post-card-excerpt">'+post.excerpt+'</p><a class="post-card-readmore" onclick="event.stopPropagation();navigateToPost(''+post.slug+'')">Read more</a></div>';}).join('')+'</div>';
    }
    function renderPost(post,wrap){
      document.title=post.title+' — Emblem Strategic';
      wrap.innerHTML='<div class="post-view"><a class="post-back" href="/blog.html" onclick="event.preventDefault();navigateToIndex()">Back to Perspectives</a><div class="post-header"><div class="post-meta"><span class="post-date">'+post.dateDisplay+'</span><span class="post-read">'+post.readTime+'</span><div class="post-tags">'+post.tags.map(function(t){return '<span class="post-tag" style="cursor:pointer" onclick="navigateToIndex(''+t.replace(/'/g,"\'")+'')">'+ t+'</span>';}).join('')+'</div></div><h1 class="post-title">'+post.title+'</h1></div><div class="post-body">'+post.body+'</div>'+(post.byline?'<div class="post-byline">'+post.byline+'</div>':'')+'</div>';
      window.scrollTo(0,0);
    }
    renderPage();
  </script>
</body>
</html>
